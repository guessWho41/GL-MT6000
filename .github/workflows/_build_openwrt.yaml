name: _Build OpenWrt for GL-MT6000 (reusable)

on:
  workflow_call:
    inputs:
      config_file:
        required: true
        type: string
      check_runner:
        required: true
        type: string
      build_runner:
        required: true
        type: string
      use_ccache:
        required: false
        type: boolean
        default: false
      keep:
        required: false
        default: "3"
        type: string

env:
  REMOTE_REPOSITORY: pesa1234/openwrt
  GH_TOKEN: ${{ github.token }}
  TARGET_REPOSITORY: "${{ github.repository }}"

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ${{ inputs.check_runner }}
    outputs:
      remote_branch: ${{ steps.check_commits.outputs.remote_branch }}
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits in pesa1234 repo
        id: check_commits
        run: |
          git clone --bare --filter=blob:none https://github.com/${{ env.REMOTE_REPOSITORY }}.git repo
          cd repo
          remote_branch=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/heads/next-* | head -n1)
          if [ -z "$remote_branch" ]; then
            echo "*** Could not determine remote_branch ***"
            exit 1
          fi
          latest_commit_sha=$(git rev-parse "${remote_branch}")
          if [ -z "$latest_commit_sha" ]; then
            echo "*** Could not get latest_commit_sha from remote_branch=$remote_branch ***"
            exit 1
          fi
          latest_body=$(gh api "repos/$TARGET_REPOSITORY/releases/latest" --jq .body 2>/dev/null || true)
          if echo "$latest_body" | grep -q "${latest_commit_sha}"; then
            echo "new_commits=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_commits=true" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "remote_branch=${remote_branch}"
            echo "latest_commit_sha=${latest_commit_sha}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build OpenWrt
    needs: check_commits
    if: github.event_name == 'workflow_dispatch' || needs.check_commits.outputs.new_commits == 'true'
    runs-on: ${{ inputs.build_runner }}
    steps:
      - name: Install dependencies and free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/share/swift \
            /usr/local/julia* \
            /usr/local/share/powershell \
            /usr/share/java \
            /home/linuxbrew \
            /usr/share/miniconda \
            /usr/local/share/chromedriver-linux64 \
            /usr/local/share/edge_driver \
            /usr/local/share/gecko_driver

          sudo docker image prune --all --force 2>/dev/null || true

          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext libncurses5-dev \
            libssl-dev python3-setuptools rsync swig unzip \
            zlib1g-dev file wget llvm

          sudo apt-get remove -y \
            firefox \
            google-chrome-stable \
            microsoft-edge-stable \
            chromium-browser
            #azure-cli mono-devel libgl1-mesa-dri \
            #'*mysql*' '*postgresql*' '*mongodb*' \
            #'google-cloud-cli' 'kubectl' 'helm' \
            #'ansible' 'snapd'

          sudo apt-get autoremove --purge -y
          sudo apt-get clean -y
          echo "=== Disk space stats ==="
          df -h

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Cache ccache (GitHub-hosted)
        if: runner.environment == 'github-hosted' && inputs.use_ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.REMOTE_REPOSITORY }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.REMOTE_REPOSITORY }}-
            ccache-${{ env.REMOTE_REPOSITORY }}

      - name: Set ccache config (GitHub-hosted)
        if: runner.environment == 'github-hosted' && inputs.use_ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=compression_level=6
          ccache --set-config=max_size=10G
          ccache --set-config=sloppiness=include_file_ctime,include_file_mtime,locale,time_macros

      - name: Checkout remote repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ needs.check_commits.outputs.remote_branch }}
          fetch-depth: 0

      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          path: "builder_repo"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          rm -rf ./feeds/packages/net/mwan3 ./feeds/luci/applications/luci-app-mwan3

      - name: Checkout mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/mwan3
          path: "feeds/packages/net/mwan3"

      - name: Checkout luci-app-mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/luci-app-mwan3
          path: "feeds/luci/applications/luci-app-mwan3"

      - name: Checkout usteer-ng repository
        uses: actions/checkout@v6
        with:
          repository: NilsRo/usteer-ng
          path: "feeds/packages/net/usteer-ng"

      - name: Refresh feed index and install packages
        run: |
          ./scripts/feeds update -i packages luci
          ./scripts/feeds install -a

      - name: Setup configuration and custom files
        run: |
          cp -v "./builder_repo/config/${{ inputs.config_file }}" .config
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            echo "CONFIG_CCACHE=y" >> .config
            echo "CONFIG_CCACHE_DIR=\"$HOME/.cache/ccache\"" >> .config
            echo "=== Ccache config ==="
            ccache -p
          fi
          rsync -a ./builder_repo/files/ ./
          rsync -a ./builder_repo/patches/ ./patches/
          while IFS= read -r -d '' file; do
            patch -f -p1 -i "${file}"
          done < <(find ./patches -name "*.patch" -print0 | sort -z)
          make defconfig

      - name: Build firmware
        run: |
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make download -j1 V=s
          }
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make -j1 V=s
          }
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            echo "=== Ccache stats ==="
            ccache -s
          fi
          mkdir -p ./release
          find ./bin -type f \( -iname 'openwrt-*-sysupgrade.bin' -or -iname 'config.buildinfo' \) -exec cp -v {} ./release/ \;
          mv -v .config release/full.config
          cd ./release && find -type f -iname 'openwrt-*-sysupgrade.bin' -exec sh -c "sha256sum {} >sha256sums" \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gl-mt6000-firmware
          path: ./release/*

      - name: Get release info
        run: |
          version=$(find ./bin -type f -iname 'version.buildinfo' -print -quit | xargs -r cat | tr -d '\n')
          if [ -z "$version" ]; then
            echo "*** version.buildinfo not found ***"
            exit 1
          fi
          RELEASE_TAG="$(date +%F)_${version}_${{ needs.check_commits.outputs.remote_branch }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Commit build artifacts
        run: |
          mv -v ./bin/* ./builder_repo/
          cd ./builder_repo
          git add .
          git diff --cached --quiet || git commit -m "$RELEASE_TAG"
          git push origin main

      - name: Create release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag -y --repo "$TARGET_REPOSITORY"
          fi
          REMOTE_REPOSITORY="${{ env.REMOTE_REPOSITORY }}"
          REMOTE_BRANCH="${{ needs.check_commits.outputs.remote_branch }}"
          LATEST_COMMIT="${{ needs.check_commits.outputs.latest_commit_sha }}"
          CONFIG_FILE="${{ inputs.config_file }}"
          cat > ./release_notes.md <<EOF
          ### 🔄 Main Repository
          - **Repository:** [${REMOTE_REPOSITORY}](https://github.com/${REMOTE_REPOSITORY})
          - **Branch:** ${REMOTE_BRANCH}
          - **Commit:** ${LATEST_COMMIT}

          ### 📝 Build Information
          - **Target:** [GL.iNet Flint 2 (GL-MT6000)](https://openwrt.org/toh/gl.inet/gl-mt6000)
          - **Configuration:** ${CONFIG_FILE}
          EOF
          package_list=$(sed -n '/<!-- package-list-start -->/,/<!-- package-list-end -->/{ /<!--/d; p }' ./builder_repo/README.md)
          if [ -z "$package_list" ]; then
            echo "WARNING: package list section not found in README.md"
            echo "- *package list not found in README.md*" >> ./release_notes.md
          else
            echo "$package_list" >> ./release_notes.md
          fi
          gh release create "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --latest --title "OpenWrt Custom Release for Flint 2 ($RELEASE_TAG)" --notes-file ./release_notes.md ./release/*

      - name: Clean up old builds
        run: |
          KEEP="${{ inputs.keep }}"
          for i in $(seq 1 10); do
            if gh api "repos/$TARGET_REPOSITORY/releases" --jq '.[].tag_name' | grep -qx "$RELEASE_TAG"; then
              break
            fi
            echo "=== Release list not yet consistent, retrying ($i)... ==="
            sleep 3
          done
          releases=$(gh api "repos/$TARGET_REPOSITORY/releases" --paginate --jq 'sort_by(.created_at) | reverse')
          echo "=== Releases that will be kept (newest $KEEP) ==="
          echo "$releases" | jq -r ".[:$KEEP] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
          echo "=== Releases that will be deleted ==="
          echo "$releases" | jq -r ".[$KEEP:] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
          cd ./builder_repo
          git fetch origin main
          git reset --hard origin/main
          echo "$releases" | jq -r ".[$KEEP:] | .[] | \"\(.id) \(.tag_name)\"" | while read id tag; do
            gh api -X DELETE "repos/$TARGET_REPOSITORY/releases/$id" && gh api -X DELETE "repos/$TARGET_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
            if [ -d "$tag" ]; then
              rm -rfv "$tag"
              git add -A
              git diff --cached --quiet || git commit -m "Delete $tag directory"
              git push origin main
            fi
          done
