name: "Build pesa1234's OpenWrt fork for GL-MT6000"

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "Runner to build on"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      remote_branch:
        description: "Remote branch to build (leave empty for the latest branch)"
        required: false
        default: ""
        type: string
      remote_commit:
        description: "Remote commit SHA to build (leave empty for the latest commit, requires remote_branch to be set)"
        required: false
        type: string
        default: ""
      use_ccache:
        description: "Use ccache"
        required: false
        default: true
        type: boolean
      testing_kernel:
        description: "Build with testing kernel"
        required: false
        default: false
        type: boolean

env:
  GH_TOKEN: ${{ github.token }}
  REMOTE_REPOSITORY: pesa1234/openwrt
  TARGET_REPOSITORY: "${{ github.repository }}"
  CONFIG_FILE: mt6000.config
  KEEP_RELEASES: 3
  KEEP_CACHES: 1

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || 'ubuntu-slim' }}
    outputs:
      remote_branch: ${{ steps.check_commits.outputs.remote_branch }}
      remote_commit: ${{ steps.check_commits.outputs.remote_commit }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits in remote repo
        id: check_commits
        run: |
          remote_commit="${{ inputs.remote_commit }}"
          remote_branch="${{ inputs.remote_branch }}"
          if [ -n "$remote_commit" ] && [ -z "$remote_branch" ]; then
            echo "*** remote_commit requires remote_branch to be specified as well ***"
            exit 1
          fi
          if [ -z "$remote_branch" ]; then
            remote_branch=$(git ls-remote "https://github.com/${{ env.REMOTE_REPOSITORY }}.git" "refs/heads/next-*" | sed -e 's|\(.*heads/\)||' | sort -V | tail -n1)
            if [ -z "$remote_branch" ]; then
              echo "*** Could not determine remote_branch ***"
              exit 1
            fi
          fi
          if [ -n "$remote_commit" ]; then
            latest_commit_sha=$(gh api "repos/${{ env.REMOTE_REPOSITORY }}/commits/${remote_commit}" --jq .sha 2>/dev/null || true)
            if [ -z "$latest_commit_sha" ]; then
              echo "*** Commit '$remote_commit' not found in ${{ env.REMOTE_REPOSITORY }} ***"
              exit 1
            fi
          else
            latest_commit_sha=$(gh api "repos/${{ env.REMOTE_REPOSITORY }}/commits/${remote_branch}" --jq .sha 2>/dev/null || true)
            if [ -z "$latest_commit_sha" ]; then
              echo "*** Could not get latest_commit_sha from remote_branch=$remote_branch ***"
              exit 1
            fi
          fi
          {
            echo "remote_branch=${remote_branch}"
            echo "remote_commit=${remote_commit}"
            echo "latest_commit_sha=${latest_commit_sha}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build OpenWrt
    needs: check_commits
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - name: Install dependencies #and free disk space
        if: runner.environment == 'github-hosted'
        run: |
          #echo "=== Disk space stats before ==="
          #df -h
          #sudo rm -rf \
          #  /usr/share/dotnet \
          #  /usr/local/lib/android \
          #  /opt/ghc \
          #  /opt/hostedtoolcache \
          #  /usr/share/swift \
          #  /usr/local/julia* \
          #  /usr/local/share/powershell \
          #  /usr/share/java \
          #  /home/linuxbrew \
          #  /usr/share/miniconda \
          #  /usr/local/share/chromedriver-linux64 \
          #  /usr/local/share/edge_driver \
          #  /usr/local/share/gecko_driver

          #sudo docker image prune --all --force 2>/dev/null || true

          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential ccache clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext libncurses5-dev \
            libssl-dev llvm mold python3-setuptools rsync swig \
            unzip zlib1g-dev file wget

          #sudo apt-get remove -y \
          #  azure-cli firefox google-chrome-stable \
          #  google-chrome-stable google-cloud-cli kubectl \
          #  microsoft-edge-stable mysql-common \
          #  php-common postgresql-common powershell snapd \
          #  temurin
            #'ansible' mono-devel libgl1-mesa-dri chromium-browser

          #sudo apt-get autoremove --purge -y
          #sudo apt-get clean -y
          #echo "=== Disk space stats after ==="
          #df -h

          #echo "=== Installed packages ==="
          #dpkg-query -W -f='${Installed-Size;8}  ${Package}\n' | sort -n

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Cache ccache (GitHub-hosted)
        if: runner.environment == 'github-hosted' && inputs.use_ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ env.REMOTE_REPOSITORY }}-${{ github.run_id }}
          restore-keys: ccache-${{ env.REMOTE_REPOSITORY }}-

      - name: Set ccache config (GitHub-hosted)
        if: runner.environment == 'github-hosted' && inputs.use_ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=compression_level=6
          ccache --set-config=max_size=10G
          ccache --set-config=sloppiness=include_file_ctime,include_file_mtime,locale,time_macros

      - name: Checkout remote repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ needs.check_commits.outputs.remote_branch }}
          fetch-depth: 0

      - name: Reset to selected commit
        if: needs.check_commits.outputs.remote_commit != ''
        run: git reset --hard "${{ needs.check_commits.outputs.latest_commit_sha }}"

      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          path: "builder_repo"

      - name: Update feeds
        run: |
          ./scripts/feeds update -a -f
          rm -rfv ./feeds/packages/net/mwan3 ./feeds/luci/applications/luci-app-mwan3

      - name: Checkout mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/mwan3
          path: "feeds/packages/net/mwan3"

      - name: Checkout luci-app-mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/luci-app-mwan3
          path: "feeds/luci/applications/luci-app-mwan3"

      - name: Checkout usteer-ng
        uses: actions/checkout@v6
        with:
          repository: NilsRo/usteer-ng
          ref: development
          fetch-depth: 0
          path: usteer-ng

      - name: Pin usteer-ng source version
        run: |
          REF=$(git -C usteer-ng describe --tags --abbrev=0)   # or: rev-parse HEAD
          sed -i "s|^PKG_SOURCE_VERSION:=.*|PKG_SOURCE_VERSION:=$REF|" \
            usteer-ng/openwrt/usteer-ng/Makefile
          grep -n '^PKG_SOURCE_VERSION' usteer-ng/openwrt/usteer-ng/Makefile

      - name: Register usteer-ng feed
        run: |
          CONF=feeds.conf
          [ -f "$CONF" ] || CONF=feeds.conf.default
          sed -i '/^src-link[[:space:]]\+usteerng[[:space:]]/d' "$CONF"
          echo "src-link usteerng $GITHUB_WORKSPACE/usteer-ng/openwrt" >> "$CONF"

      - name: Refresh feed index and install packages
        run: |
          ./scripts/feeds update -i packages luci
          ./scripts/feeds update usteerng
          ./scripts/feeds install -a

      - name: Setup configuration and custom files
        run: |
          cp -v "./builder_repo/config/${{ env.CONFIG_FILE }}" .config
          if [ "${{ inputs.use_ccache }}" = "true" ]; then
            if command -v ccache >/dev/null 2>&1; then
              echo "CONFIG_CCACHE=y" >> .config
              echo "CONFIG_CCACHE_DIR=\"$HOME/.cache/ccache\"" >> .config
              echo "=== ccache config ==="
              ccache -p
              echo "=== ccache config ==="
            else
              echo "WARNING: ccache is enabled but ccache binary was not found on the runner. Building without ccache"
            fi
          fi
          if [ "${{ inputs.testing_kernel }}" = "true" ]; then
            if grep -q '^# CONFIG_TESTING_KERNEL is not set$' .config; then
              sed -i 's/^# CONFIG_TESTING_KERNEL is not set$/CONFIG_TESTING_KERNEL=y/' .config
            elif ! grep -q '^CONFIG_TESTING_KERNEL=' .config; then
              echo "CONFIG_TESTING_KERNEL=y" >> .config
            fi
          fi
          rsync -a ./builder_repo/files/ ./
          rsync -a ./builder_repo/patches/ ./patches/
          while IFS= read -r -d '' file; do
            patch -f -p1 -i "${file}"
          done < <(find ./patches -name "*.patch" -print0 | sort -z)
          make defconfig

      - name: Build firmware
        run: |
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make download -j1 V=s
          }
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make -j1 V=s
          }
          if [ "${{ inputs.use_ccache }}" = "true" ] && command -v ccache >/dev/null 2>&1; then
            echo "=== ccache stats ==="
            ccache -s
            echo "=== ccache stats ==="
          fi
          mkdir -p ./release
          find ./bin -type f \( -iname 'openwrt-*-sysupgrade.bin' -or -iname 'config.buildinfo' \) -exec cp -v {} ./release/ \;
          mv -v .config release/full.config
          cd ./release && find -type f -iname 'openwrt-*-sysupgrade.bin' -exec sh -c "sha256sum {} >sha256sums" \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gl-mt6000-firmware
          path: ./release/*

      - name: Get release info
        run: |
          version=$(find ./bin -type f -iname 'version.buildinfo' -print -quit | xargs -r cat | tr -d '\n')
          if [ -z "$version" ]; then
            echo "*** version.buildinfo not found ***"
            exit 1
          fi
          RELEASE_TAG="$(date +%F)_${version}_${{ needs.check_commits.outputs.remote_branch }}"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Commit build artifacts
        run: |
          mv -v ./bin/* ./builder_repo/
          cd ./builder_repo
          git add .
          git diff --cached --quiet || git commit -m "$RELEASE_TAG"
          git push origin main

      - name: Create release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag -y --repo "$TARGET_REPOSITORY"
          fi
          REMOTE_REPOSITORY="${{ env.REMOTE_REPOSITORY }}"
          REMOTE_BRANCH="${{ needs.check_commits.outputs.remote_branch }}"
          LATEST_COMMIT="${{ needs.check_commits.outputs.latest_commit_sha }}"
          cat > ./release_notes.md <<EOF
          ### 🔄 Main Repository
          - **Repository:** [${REMOTE_REPOSITORY}](https://github.com/${REMOTE_REPOSITORY})
          - **Branch:** ${REMOTE_BRANCH}
          - **Commit:** ${LATEST_COMMIT}

          ### 📝 Build Information
          - **Target:** [GL.iNet Flint 2 (GL-MT6000)](https://openwrt.org/toh/gl.inet/gl-mt6000)
          - **Configuration:** [${{ env.CONFIG_FILE }}](https://github.com/$TARGET_REPOSITORY/blob/main/config/${{ env.CONFIG_FILE }})
          EOF
          package_list=$(sed -n '/<!-- package-list-start -->/,/<!-- package-list-end -->/{ /<!--/d; p }' ./builder_repo/README.md)
          if [ -z "$package_list" ]; then
            echo "WARNING: package list section not found in README.md"
            echo "- *package list not found in README.md*" >> ./release_notes.md
          else
            echo "$package_list" >> ./release_notes.md
          fi
          gh release create "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --latest --title "Custom build of pesa1234's OpenWrt fork for GL-MT6000 ($RELEASE_TAG)" --notes-file ./release_notes.md ./release/*

      - name: Clean up old builds
        run: |
          for i in $(seq 1 10); do
            if gh api "repos/$TARGET_REPOSITORY/releases" --jq '.[].tag_name' | grep -qx "$RELEASE_TAG"; then
              break
            fi
            echo "=== Release list not yet consistent, retrying ($i)... ==="
            sleep 3
          done
          releases=$(gh api "repos/$TARGET_REPOSITORY/releases" --paginate --jq 'sort_by(.created_at) | reverse')
          echo "=== Releases that will be kept (newest ${{ env.KEEP_RELEASES }}) ==="
          echo "$releases" | jq -r ".[:${{ env.KEEP_RELEASES }}] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
          echo "=== Releases that will be deleted ==="
          echo "$releases" | jq -r ".[${{ env.KEEP_RELEASES }}:] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
          cd ./builder_repo
          git fetch origin main
          git reset --hard origin/main
          echo "$releases" | jq -r ".[${{ env.KEEP_RELEASES }}:] | .[] | \"\(.id) \(.tag_name)\"" | while read id tag; do
            gh api -X DELETE "repos/$TARGET_REPOSITORY/releases/$id" && gh api -X DELETE "repos/$TARGET_REPOSITORY/git/refs/tags/$tag" 2>/dev/null || true
            if [ -d "$tag" ]; then
              rm -rfv "$tag"
              git add -A
              git diff --cached --quiet || git commit -m "Delete $tag directory"
              git push origin main
            fi
          done

      - name: Evict old ccache entries
        if: runner.environment == 'github-hosted'
        env:
          GH_REPO: ${{ env.TARGET_REPOSITORY }}
          KEY_PREFIX: ccache-${{ env.REMOTE_REPOSITORY }}-
        run: |
          echo "=== Matching caches (most-recently-used first) ==="
          gh cache list --limit 100 --json id,key,lastAccessedAt --jq "map(select(.key | startswith(\"$KEY_PREFIX\"))) | sort_by(.lastAccessedAt) | reverse | .[] | \"\(.lastAccessedAt)  id=\(.id)  key=\(.key)\""
          echo "=== Deleting all but the newest ${{ env.KEEP_CACHES }} ==="
          gh cache list --limit 100 --json id,key,lastAccessedAt --jq "map(select(.key | startswith(\"$KEY_PREFIX\"))) | sort_by(.lastAccessedAt) | reverse | .[${{ env.KEEP_CACHES }}:] | .[].id" | while read id; do
              echo "deleting cache id=$id"
              gh cache delete "$id" || true
          done
