name: "DEBUG golang bootstrap on arm64"
 
permissions:
  contents: read
 
on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: "Runner to probe"
        required: false
        default: ubuntu-26.04-arm
        type: choice
        options:
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - ubuntu-24.04
          - ubuntu-26.04
      remote_branch:
        description: "Remote branch (leave empty for the latest next-*)"
        required: false
        default: ""
        type: string
 
env:
  GH_TOKEN: ${{ github.token }}
  REMOTE_REPOSITORY: pesa1234/openwrt
 
jobs:
  probe:
    name: Probe golang bootstrap config
    runs-on: ${{ inputs.runner_label }}
    steps:
      - name: Runner identity
        run: |
          echo "=== runner context ==="
          echo "runner.arch         = ${{ runner.arch }}"
          echo "runner.os           = ${{ runner.os }}"
          echo "runner.environment  = ${{ runner.environment }}"
          echo "uname -m            = $(uname -m)"
          echo "nproc               = $(nproc)"
          echo
          echo "=== os release ==="
          cat /etc/os-release
 
      - name: Preinstalled Go, if any
        run: |
          echo "=== which go ==="
          command -v go || echo "(go not on PATH)"
          echo "=== go version ==="
          go version 2>/dev/null || echo "(no go)"
          echo "=== go env GOROOT ==="
          go env GOROOT 2>/dev/null || echo "(no go)"
 
      - name: Install distro Go
        run: |
          sudo apt-get update -y
          sudo apt-get install -y golang-go
          echo "=== after apt install ==="
          command -v go
          go version
          echo "GOROOT = $(go env GOROOT)"
          echo "GOARCH = $(go env GOARCH)"
          echo "GOHOSTARCH = $(go env GOHOSTARCH)"
          echo
          echo "=== what the package actually placed ==="
          dpkg -L golang-go | grep -E '/(bin|lib)/' | head -40
          echo
          echo "=== candidate GOROOT paths on disk ==="
          ls -d /usr/lib/go* 2>/dev/null || echo "(none under /usr/lib)"
          ls -d /usr/local/go* 2>/dev/null || echo "(none under /usr/local)"
 
      - name: Determine remote branch
        id: branch
        run: |
          remote_branch="${{ inputs.remote_branch }}"
          if [ -z "$remote_branch" ]; then
            remote_branch=$(git ls-remote "https://github.com/${{ env.REMOTE_REPOSITORY }}.git" "refs/heads/next-*" \
              | sed -e 's|\(.*heads/\)||' | sort -V | tail -n1)
          fi
          echo "remote_branch=${remote_branch}" | tee -a "$GITHUB_OUTPUT"
 
      - name: Checkout OpenWrt
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ steps.branch.outputs.remote_branch }}
          fetch-depth: 0
 
      - name: Update feeds
        run: |
          scripts/feeds update -a
          scripts/feeds install -a
 
      - name: Find the golang Config.in symbols
        run: |
          echo "=== golang feed layout ==="
          find feeds/packages/lang/golang -maxdepth 2 -type f \( -name 'Config.in' -o -name 'Makefile' \) | sort
          echo
          echo "=== every CONFIG symbol defined under lang/golang ==="
          grep -rhn --include='Config.in' -E '^\s*(config|menuconfig)\s+\S+' feeds/packages/lang/golang/ | sort -u
          echo
          echo "=== BOOTSTRAP-related symbols with surrounding context ==="
          grep -rn --include='Config.in' -B2 -A12 -i 'bootstrap' feeds/packages/lang/golang/ || echo "(no match)"
 
      - name: Host arch mapping in golang-bootstrap
        run: |
          echo "=== golang-bootstrap Makefile ==="
          cat feeds/packages/lang/golang/golang-bootstrap/Makefile 2>/dev/null || echo "(not found)"
          echo
          echo "=== golang-values.mk (host arch detection) ==="
          cat feeds/packages/lang/golang/golang/golang-values.mk 2>/dev/null || echo "(not found)"
 
      - name: Which symbols appear after defconfig
        run: |
          echo "CONFIG_TARGET_mediatek=y"            >  .config
          echo "CONFIG_TARGET_mediatek_filogic=y"    >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_glinet_gl-mt6000=y" >> .config
          make defconfig >/dev/null 2>&1 || true
          echo "=== all GOLANG symbols present after defconfig ==="
          grep -E 'GOLANG' .config || echo "(none present)"
          echo
          echo "=== same, from the full symbol database ==="
          grep -rhn -E 'GOLANG[A-Z_]*' tmp/.config-* 2>/dev/null | sort -u | head -40 || echo "(no tmp config db)"
 
      - name: Try setting the external bootstrap root
        run: |
          GOROOT_HOST="$(go env GOROOT)"
          echo "Using GOROOT_HOST=${GOROOT_HOST}"
          for sym in \
            CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT \
            CONFIG_GOLANG_EXTERNAL_BOOTSTRAP \
            CONFIG_GOLANG_BOOTSTRAP_ROOT ; do
            if grep -rq "$(echo "$sym" | sed 's/^CONFIG_//')" feeds/packages/lang/golang/ 2>/dev/null; then
              echo ">>> symbol '$sym' appears in the feed sources"
            else
              echo "    symbol '$sym' not found in feed sources"
            fi
          done
          echo
          echo "=== writing best-guess config and running defconfig ==="
          sed -i -e '/^CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=/d' .config
          echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"${GOROOT_HOST}\"" >> .config
          make defconfig >/dev/null 2>&1 || true
          echo "=== did it survive defconfig? ==="
          grep -E 'GOLANG' .config || echo "(nothing kept)"
