name: "DEBUG SHA checkout strategies"

on:
  workflow_dispatch:
    inputs:
      runner_type:
        description: "Runner"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - self-hosted
      remote_commit:
        description: "Commit SHA to build"
        required: true
        type: string
      containing_branch:
        description: "Branch that contains the commit (for strategy B/C)"
        required: true
        type: string

env:
  GH_TOKEN: ${{ github.token }}
  REMOTE_REPOSITORY: pesa1234/openwrt

jobs:
  strategy_a:
    name: "A - direct SHA checkout (known bad)"
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ inputs.remote_commit }}
          fetch-depth: 0
          fetch-tags: true
      - name: Diagnostics
        run: |
          echo "=== HEAD state ==="
          git status | head -3
          git rev-parse HEAD
          echo "=== tags ==="
          git tag -l | wc -l
          echo "=== describe ==="
          git describe --tags --always || echo "describe failed"
          echo "=== getver.sh ==="
          ./scripts/getver.sh || echo "getver.sh failed"

  strategy_b:
    name: "B - checkout branch, then git checkout SHA"
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ inputs.containing_branch }}
          fetch-depth: 0
          fetch-tags: true
      - name: Switch to commit
        run: git checkout "${{ inputs.remote_commit }}"
      - name: Diagnostics
        run: |
          echo "=== HEAD state ==="
          git status | head -3
          git rev-parse HEAD
          echo "=== tags ==="
          git tag -l | wc -l
          echo "=== describe ==="
          git describe --tags --always || echo "describe failed"
          echo "=== getver.sh ==="
          ./scripts/getver.sh || echo "getver.sh failed"

  strategy_c:
    name: "C - checkout branch, then git reset --hard SHA"
    runs-on: ${{ inputs.runner_type == 'self-hosted' && 'self-hosted' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ inputs.containing_branch }}
          fetch-depth: 0
          fetch-tags: true
      - name: Reset to commit
        run: git reset --hard "${{ inputs.remote_commit }}"
      - name: Diagnostics
        run: |
          echo "=== HEAD state ==="
          git status | head -3
          git rev-parse HEAD
          echo "=== tags ==="
          git tag -l | wc -l
          echo "=== describe ==="
          git describe --tags --always || echo "describe failed"
          echo "=== getver.sh ==="
          ./scripts/getver.sh || echo "getver.sh failed"
