name: Cleanup old releases (debug)
 
permissions:
  contents: write
  actions: write
 
on:
  workflow_dispatch:
    inputs:
      keep:
        description: "Number of newest releases to keep"
        required: false
        default: "3"
        type: string
      dry_run:
        description: "List what would be deleted without deleting"
        required: false
        default: true
        type: boolean
 
env:
  GH_TOKEN: ${{ github.token }}
  TARGET_REPOSITORY: "${{ github.repository }}"
 
jobs:
  cleanup:
    name: Cleanup old releases
    runs-on: ubuntu-slim
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          path: "builder_repo"
 
      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
 
      - name: Show raw release list
        run: |
          echo "===== KEEP=${{ inputs.keep }}  DRY_RUN=${{ inputs.dry_run }} ====="
          echo
          echo "===== Raw release list (newest first by created_at) ====="
          gh api "repos/$TARGET_REPOSITORY/releases" --paginate \
            --jq 'sort_by(.created_at) | reverse | .[] | "\(.created_at)  id=\(.id)  tag=\(.tag_name)"'
          echo
          total=$(gh api "repos/$TARGET_REPOSITORY/releases" --paginate --jq '.[].id' | wc -l)
          echo "Total releases: $total"
 
      - name: Show what will be kept and deleted
        run: |
          KEEP="${{ inputs.keep }}"
          echo "===== Releases that will be KEPT (newest $KEEP) ====="
          gh api "repos/$TARGET_REPOSITORY/releases" --paginate \
            --jq "sort_by(.created_at) | reverse | .[:$KEEP] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
          echo
          echo "===== Releases that will be DELETED ====="
          gh api "repos/$TARGET_REPOSITORY/releases" --paginate \
            --jq "sort_by(.created_at) | reverse | .[$KEEP:] | .[] | \"\(.created_at)  id=\(.id)  tag=\(.tag_name)\""
 
      - name: Show tags and build directories
        run: |
          echo "===== Git tags in repo ====="
          cd ./builder_repo
          git tag -l || echo "(none)"
          echo
          echo "===== Top-level directories (potential build dirs) ====="
          find . -maxdepth 1 -type d -not -name '.git' -not -name '.' | sort
          cd ..
 
      - name: Perform cleanup
        run: |
          KEEP="${{ inputs.keep }}"
          DRY_RUN="${{ inputs.dry_run }}"
          cd ./builder_repo
          git fetch origin main
          git reset --hard origin/main
          gh api "repos/$TARGET_REPOSITORY/releases" --paginate \
            --jq "sort_by(.created_at) | reverse | .[$KEEP:] | .[] | \"\(.id) \(.tag_name)\"" \
            | while read id tag; do
              echo "--- processing id=$id tag=$tag ---"
              if [ "$DRY_RUN" = "true" ]; then
                echo "[dry-run] would delete release id=$id and tag=$tag"
              else
                if gh api -X DELETE "repos/$TARGET_REPOSITORY/releases/$id"; then
                  echo "deleted release id=$id"
                else
                  echo "FAILED to delete release id=$id"
                fi
                if gh api -X DELETE "repos/$TARGET_REPOSITORY/git/refs/tags/$tag" 2>/dev/null; then
                  echo "deleted tag $tag"
                else
                  echo "tag $tag not deleted (may not exist)"
                fi
              fi
              if [ -d "$tag" ]; then
                echo "found build directory: $tag"
                if [ "$DRY_RUN" = "true" ]; then
                  echo "[dry-run] would remove directory $tag and commit"
                else
                  rm -rfv "$tag"
                  git add -A
                  git diff --cached --quiet || git commit -m "Delete $tag directory"
                  git push origin main
                fi
              else
                echo "no build directory named $tag"
              fi
            done
          echo "===== cleanup complete ====="
