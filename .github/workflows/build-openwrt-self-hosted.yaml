name: Build (self-hosted)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      testing_kernel:
        description: "Build with the testing kernel"
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build OpenWrt for GL-MT6000
    uses: ./.github/workflows/_build_openwrt.yaml
    with:
      check_runner: self-hosted
      build_runner: self-hosted
      use_ccache: true
      config_file: mt6000.config
      testing_kernel: ${{ inputs.testing_kernel }}
    permissions:
      contents: write
      actions: write
