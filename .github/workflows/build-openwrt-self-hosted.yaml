name: Build OpenWrt for GL-MT6000 self-hosted

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  # push:
    # branches:
      # - main
  #schedule:
    #- cron: "38 1 * * *"

env:
  REMOTE_REPOSITORY: pesa1234/openwrt
  CONFIG_FILE: mt6000.config
  GH_TOKEN: ${{ github.token }}
  TARGET_REPOSITORY: "${{ github.repository }}"

jobs:
  check_commits:
    name: Check for new commits
    runs-on: self-hosted
    outputs:
      remote_branch: ${{ steps.check_commits.outputs.remote_branch }}
      release_prefix: ${{ steps.check_commits.outputs.release_prefix }}
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits in pesa1234 repo
        id: check_commits
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/${{ env.REMOTE_REPOSITORY }}.git repo
          cd repo
          git fetch --prune origin "+refs/heads/*:refs/remotes/origin/*"
          remote_branch=$(git for-each-ref --sort=-committerdate --format='%(refname:short)' refs/remotes/origin/next-* | head -n1 | sed 's|origin/||')
          if [ -z "$remote_branch" ]; then
            echo "*** COULD NOT DETERMINE remote_branch ***"
            exit 1
          fi
          latest_commit_sha=$(git rev-parse "origin/${remote_branch}")
          if [ -z "$latest_commit_sha" ]; then
            echo "*** COULD NOT GET latest_commit_sha FROM remote_branch=$remote_branch ***"
          exit 1
          fi
          if gh api "repos/$TARGET_REPOSITORY/releases/latest" --jq .body 2>/dev/null | grep -q "${latest_commit_sha}"; then
            echo "new_commits=false" >> $GITHUB_OUTPUT
          else
            echo "new_commits=true" >> $GITHUB_OUTPUT
          fi
          release_prefix="${remote_branch%.rss*}"
          echo "remote_branch=${remote_branch}"
          echo "release_prefix=${release_prefix}"
          echo "latest_commit_sha=${latest_commit_sha}"
          {
            echo "remote_branch=${remote_branch}"
            echo "release_prefix=${release_prefix}"
            echo "latest_commit_sha=${latest_commit_sha}"
          } >> $GITHUB_OUTPUT

  build:
    name: Build OpenWrt
    needs: check_commits
    if: github.event_name == 'workflow_dispatch' || needs.check_commits.outputs.new_commits == 'true'
    runs-on: self-hosted
    steps:
      - name: Checkout remote repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ needs.check_commits.outputs.remote_branch }}
          fetch-depth: 0

      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          path: "builder_repo"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # Remove mwan3 and luci-app-mwan3 files
          rm -rf ./feeds/packages/net/mwan3
          rm -rf ./feeds/luci/applications/luci-app-mwan3

      - name: Checkout mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/mwan3
          path: "feeds/packages/net/mwan3"

      - name: Checkout luci-app-mwan3 nftables repository
        uses: actions/checkout@v6
        with:
          repository: dl12345/luci-app-mwan3
          path: "feeds/luci/applications/luci-app-mwan3"

      - name: Setup configuration and custom files
        run: |
          cp -v ./builder_repo/config/${{ env.CONFIG_FILE }} .config
          cp -rv ./builder_repo/files ./
          cp -rv ./builder_repo/patches ./
          for file in $(find ./patches -name "*.patch" | sort); do patch -f -p1 -i ${file}; done
          make defconfig

      - name: Build firmware
        run: |
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make download -j1 V=s
          }
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 30
            make -j1 V=s
          }
          mkdir -p ./release
          find ./bin -type f \( -iname 'openwrt-*-sysupgrade.bin' -or -iname 'config.buildinfo' \) -exec cp -v {} ./release/ \; ||:
          mv -v .config release/full.config ||:
          cd ./release && find -type f -iname 'openwrt-*-sysupgrade.bin' -exec sh -c "sha256sum {} >sha256sums" \; ||:

      - name: Upload artifacts
        uses: actions/upload-artifact@v6.0.0
        with:
          name: gl-mt6000-firmware
          path: ./release/*

      - name: Get release info
        run: |
          VERSION=$(find ./bin -type f -iname 'version.buildinfo' -print -quit | xargs -r cat | tr -d '\n')
          TAG="$(date +%F)_${VERSION}_${{ needs.check_commits.outputs.remote_branch }}"
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Configure Git identity
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Commit build artifacts
        run: |
          mv -v ./bin/* ./builder_repo/ ||:
          cd ./builder_repo
          git add .
          git diff --cached --quiet || git commit -m "$RELEASE_TAG"
          git push origin main
          cd ..

      - name: Create release
        run: |
          if gh release view "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --cleanup-tag -y --repo "$TARGET_REPOSITORY"
          fi
          gh release create "$RELEASE_TAG" --repo "$TARGET_REPOSITORY" --latest --notes "### 🔄 Main Repository
          - **Repository:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }})
          - **Branch:** ${{ needs.check_commits.outputs.remote_branch }}
          - **Commit:** ${{ needs.check_commits.outputs.latest_commit_sha }}
          
          ### 📝 Build Information
          - **Target:** [Flint 2 (GL-MT6000)](https://openwrt.org/toh/gl.inet/gl-mt6000)
          - **Configuration:** [${{ env.CONFIG_FILE }}](${{ env.CONFIG_FILE }})
          - **Dropbear replaced with OpenSSH and SFTP with hardened config**
          - **Mbed TLS relaced with OpenSSL**
          - **uHTTPd replaced with nginx**
          - **Wi-Fi UCODE scripts**
          - **Ad Block Fast**
          - **Bridger**
          - **DDNS**
          - **DNS Crypt Proxy**
          - **Irqbalance with exceptions set by smp_affinity**
          - **MWAN3**
          - **SQM**
          - **TCP BBR**
          - **UPnP**
          - **Usteer**
          - **Wireguard VPN with NPTv6**
          - **ZRAM**
          - **Removed:** odhcpd and ppp" --title "OpenWrt Custom Release for Flint 2 ($RELEASE_TAG)" ./release/*

      - name: Clean up old releases
        run: |
          cd ./builder_repo
          git fetch origin main
          git reset --hard origin/main
          gh api repos/$TARGET_REPOSITORY/releases --paginate --jq '[ .[] | select(.tag_name) ] | .[5:] | .[] | "\(.id) \(.tag_name)"' | while read id tag; do
            gh api -X DELETE "repos/$TARGET_REPOSITORY/releases/$id" && gh api -X DELETE "repos/$TARGET_REPOSITORY/git/refs/tags/$tag" 2>/dev/null ||:
            if [ -d "$tag" ]; then
              rm -rfv "$tag"
              git add -A
              git diff --cached --quiet || git commit -m "Delete $tag directory"
              git push origin main
            fi
          done
